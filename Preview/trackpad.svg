<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <defs>
    <linearGradient id="surf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2125"/>
      <stop offset="1" stop-color="#16181b"/>
    </linearGradient>
  </defs>

  <!-- Frame -->
  <rect x="1" y="1" width="388" height="842" rx="44" fill="#0a0a0c"/>
  <rect x="5" y="5" width="380" height="834" rx="40" fill="#000"/>
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#000"/>

  <!-- Status bar -->
  <text x="24" y="33" font-family="-apple-system, Helvetica, Arial" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g fill="#fff">
    <rect x="300" y="22" width="18" height="10" rx="3"/>
    <rect x="322" y="24" width="12" height="8" rx="2"/>
    <circle cx="348" cy="27" r="4" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Status line -->
  <circle cx="28" cy="70" r="5" fill="#30d158"/>
  <text x="40" y="75" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#98989f">Connecté au Mac — 1 doigt : curseur · 2 : défilement · 3 : glisser</text>

  <!-- Trackpad surface -->
  <rect x="20" y="95" width="350" height="600" rx="22" fill="url(#surf)" stroke="#3a3a3e" stroke-width="1.5"/>

  <!-- Cursor hint -->
  <text x="195" y="300" font-family="-apple-system, Helvetica, Arial" font-size="15" fill="#5f5f66" text-anchor="middle">Surface tactile</text>
  <text x="195" y="325" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#48484d" text-anchor="middle">bougez 1 doigt pour déplacer le curseur</text>
  <circle cx="195" cy="390" r="2.5" fill="#30d158"/>

  <!-- Sliders -->
  <g>
    <text x="20" y="730" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#d1d1d6">Vitesse du curseur</text>
    <text x="370" y="730" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#8e8e93" text-anchor="end">1.5×</text>
    <rect x="20" y="740" width="350" height="4" rx="2" fill="#3a3a3e"/>
    <rect x="20" y="740" width="160" height="4" rx="2" fill="#0a84ff"/>
    <circle cx="180" cy="742" r="10" fill="#fff"/>
  </g>
  <g>
    <text x="20" y="772" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#d1d1d6">Vitesse de défilement</text>
    <text x="370" y="772" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#8e8e93" text-anchor="end">2.0×</text>
    <rect x="20" y="782" width="350" height="4" rx="2" fill="#3a3a3e"/>
    <rect x="20" y="782" width="210" height="4" rx="2" fill="#0a84ff"/>
    <circle cx="230" cy="784" r="10" fill="#fff"/>
  </g>

  <!-- Tab bar -->
  <rect x="6" y="790" width="378" height="48" rx="22" fill="#111114"/>
  <g text-anchor="middle">
    <rect x="34" y="800" width="42" height="28" rx="7" fill="#0a84ff" opacity="0.25"/>
    <rect x="44" y="806" width="22" height="16" rx="3" fill="#0a84ff"/>
    <text x="55" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#0a84ff">Trackpad</text>

    <rect x="145" y="807" width="20" height="13" rx="2" fill="#8e8e93"/>
    <rect x="149" y="811" width="12" height="2" rx="1" fill="#111"/>
    <text x="155" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Clavier</text>

    <polygon points="252,805 268,813 252,822" fill="#8e8e93"/>
    <rect x="272" y="805" width="3" height="17" rx="1.5" fill="#8e8e93"/>
    <text x="258" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Média</text>

    <polygon points="352,807 344,814 347,817 340,821 354,813 351,809" fill="#8e8e93"/>
    <text x="347" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Racc.</text>
  </g>
  <rect x="170" y="821" width="50" height="5" rx="2.5" fill="#2c2c2e"/>
</svg>
