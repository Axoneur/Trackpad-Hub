<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <!-- Frame -->
  <rect x="1" y="1" width="388" height="842" rx="44" fill="#0a0a0c"/>
  <rect x="5" y="5" width="380" height="834" rx="40" fill="#000"/>
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#000"/>
  <text x="24" y="33" font-family="-apple-system, Helvetica, Arial" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g fill="#fff">
    <rect x="300" y="22" width="18" height="10" rx="3"/>
    <rect x="322" y="24" width="12" height="8" rx="2"/>
    <circle cx="348" cy="27" r="4" fill="#fff" opacity="0.6"/>
  </g>

  <!-- Status -->
  <circle cx="28" cy="70" r="5" fill="#30d158"/>
  <text x="40" y="75" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#98989f">Connecté — envoyez du texte ou des raccourcis</text>

  <!-- Text field + send -->
  <rect x="20" y="95" width="290" height="44" rx="10" fill="#1c1c1e" stroke="#3a3a3e"/>
  <text x="34" y="122" font-family="-apple-system, Helvetica, Arial" font-size="14" fill="#5f5f66">Écrire du texte à envoyer au Mac…</text>
  <rect x="318" y="95" width="52" height="44" rx="10" fill="#0a84ff"/>
  <text x="344" y="122" font-family="-apple-system, Helvetica, Arial" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Envoyer</text>

  <!-- Modifiers -->
  <g font-family="-apple-system, Helvetica, Arial" font-size="13" font-weight="500" fill="#d1d1d6">
    <rect x="20" y="155" width="85" height="44" rx="9" fill="#2c2c2e"/>
    <text x="62" y="181" text-anchor="middle">⌘ Cmd</text>
    <rect x="113" y="155" width="85" height="44" rx="9" fill="#2c2c2e"/>
    <text x="155" y="181" text-anchor="middle">⌥ Opt</text>
    <rect x="206" y="155" width="85" height="44" rx="9" fill="#2c2c2e"/>
    <text x="248" y="181" text-anchor="middle">⌃ Ctrl</text>
    <rect x="299" y="155" width="71" height="44" rx="9" fill="#0a84ff"/>
    <text x="334" y="181" text-anchor="middle" fill="#fff">⇧ Maj</text>
  </g>

  <!-- Special keys -->
  <g font-family="-apple-system, Helvetica, Arial" font-size="13" font-weight="500" fill="#d1d1d6">
    <rect x="20" y="211" width="66" height="46" rx="9" fill="#2c2c2e"/>
    <text x="53" y="238" text-anchor="middle">Échap</text>
    <rect x="94" y="211" width="110" height="46" rx="9" fill="#2c2c2e"/>
    <text x="149" y="238" text-anchor="middle">Espace</text>
    <rect x="212" y="211" width="44" height="46" rx="9" fill="#2c2c2e"/>
    <text x="234" y="239" font-size="16" text-anchor="middle">◀</text>
    <rect x="264" y="211" width="44" height="46" rx="9" fill="#2c2c2e"/>
    <text x="286" y="239" font-size="16" text-anchor="middle">▲</text>
    <rect x="316" y="211" width="44" height="46" rx="9" fill="#2c2c2e"/>
    <text x="338" y="239" font-size="16" text-anchor="middle">▶</text>
  </g>

  <!-- Keyboard rows -->
  <g font-family="-apple-system, Helvetica, Arial" font-size="14" font-weight="500" fill="#d1d1d6">
    <!-- Row 1 -->
    <rect x="20" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="37" y="307" text-anchor="middle">Q</text>
    <rect x="58" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="75" y="307" text-anchor="middle">W</text>
    <rect x="96" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="113" y="307" text-anchor="middle">E</text>
    <rect x="134" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="151" y="307" text-anchor="middle">R</text>
    <rect x="172" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="189" y="307" text-anchor="middle">T</text>
    <rect x="210" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="227" y="307" text-anchor="middle">Y</text>
    <rect x="248" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="265" y="307" text-anchor="middle">U</text>
    <rect x="286" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="303" y="307" text-anchor="middle">I</text>
    <rect x="324" y="279" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="341" y="307" text-anchor="middle">O</text>
    <!-- Row 2 -->
    <rect x="36" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="53" y="361" text-anchor="middle">A</text>
    <rect x="74" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="91" y="361" text-anchor="middle">S</text>
    <rect x="112" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="129" y="361" text-anchor="middle">D</text>
    <rect x="150" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="167" y="361" text-anchor="middle">F</text>
    <rect x="188" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="205" y="361" text-anchor="middle">G</text>
    <rect x="226" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="243" y="361" text-anchor="middle">H</text>
    <rect x="264" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="281" y="361" text-anchor="middle">J</text>
    <rect x="302" y="333" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="319" y="361" text-anchor="middle">K</text>
    <!-- Row 3 -->
    <rect x="48" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="65" y="415" text-anchor="middle">Z</text>
    <rect x="86" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="103" y="415" text-anchor="middle">X</text>
    <rect x="124" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="141" y="415" text-anchor="middle">C</text>
    <rect x="162" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="179" y="415" text-anchor="middle">V</text>
    <rect x="200" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="217" y="415" text-anchor="middle">B</text>
    <rect x="238" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="255" y="415" text-anchor="middle">N</text>
    <rect x="276" y="387" width="34" height="48" rx="8" fill="#2c2c2e"/><text x="293" y="415" text-anchor="middle">M</text>
  </g>

  <!-- Hint -->
  <text x="195" y="480" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#5f5f66" text-anchor="middle">Raccourcis : touchez ⌘ + une lettre (ex. ⌘C, ⌘V)</text>
  <text x="195" y="500" font-family="-apple-system, Helvetica, Arial" font-size="12" fill="#5f5f66" text-anchor="middle">Le clavier complet se trouve dans l'extension (voir Réglages)</text>

  <!-- Tab bar -->
  <rect x="6" y="790" width="378" height="48" rx="22" fill="#111114"/>
  <g text-anchor="middle">
    <rect x="34" y="806" width="22" height="16" rx="3" fill="#8e8e93"/>
    <text x="55" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Trackpad</text>
    <rect x="145" y="800" width="42" height="28" rx="7" fill="#0a84ff" opacity="0.25"/>
    <rect x="149" y="807" width="20" height="13" rx="2" fill="#0a84ff"/>
    <rect x="153" y="811" width="12" height="2" rx="1" fill="#111"/>
    <text x="155" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#0a84ff">Clavier</text>
    <polygon points="252,805 268,813 252,822" fill="#8e8e93"/>
    <rect x="272" y="805" width="3" height="17" rx="1.5" fill="#8e8e93"/>
    <text x="258" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Média</text>
    <polygon points="352,807 344,814 347,817 340,821 354,813 351,809" fill="#8e8e93"/>
    <text x="347" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Racc.</text>
  </g>
  <rect x="170" y="821" width="50" height="5" rx="2.5" fill="#2c2c2e"/>
</svg>
