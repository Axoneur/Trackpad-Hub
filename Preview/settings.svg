  </g>

  <text x="20" y="112" font-family="-apple-system, Helvetica, Arial" font-size="24" font-weight="700" fill="#fff">Réglages</text>

  <!-- Connexion -->
  <g font-family="-apple-system, Helvetica, Arial">
    <rect x="20" y="130" width="350" height="140" rx="14" fill="#1c1c1e"/>
    <circle cx="46" cy="165" r="9" fill="none" stroke="#0a84ff" stroke-width="2.5"/>
    <rect x="40" y="153" width="4" height="12" rx="2" fill="#0a84ff"/>
    <rect x="44" y="149" width="4" height="20" rx="2" fill="#0a84ff"/>
