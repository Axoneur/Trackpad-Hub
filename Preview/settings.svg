    <text x="68" y="183" font-size="12" fill="#8e8e93">Connecté au Mac</text>

    <rect x="20" y="182" width="350" height="0.5" fill="#3a3a3e"/>
    <circle cx="46" cy="215" r="9" fill="none" stroke="#8e8e93" stroke-width="2.5"/>
    <rect x="40" y="203" width="4" height="12" rx="2" fill="#8e8e93"/>
    <rect x="44" y="199" width="4" height="20" rx="2" fill="#8e8e93"/>
    <rect x="48" y="205" width="4" height="8" rx="2" fill="#8e8e93"/>
    <text x="68" y="213" font-size="15" font-weight="500" fill="#fff">Appareils</text>
    <text x="68" y="233" font-size="12" fill="#8e8e93">iPhone de Tim · iPhone de Tim (Clavier)</text>
  </g>

  <!-- Clavier -->
  <g font-family="-apple-system, Helvetica, Arial">
    <rect x="20" y="286" width="350" height="150" rx="14" fill="#1c1c1e"/>
    <text x="36" y="312" font-size="15" font-weight="500" fill="#fff">Clavier complet (extension)</text>
    <text x="36" y="332" font-size="12" fill="#8e8e93">1. Réglages › Claviers › Ajouter un clavier</text>
    <text x="36" y="352" font-size="12" fill="#8e8e93">2. Choisissez « Clavier TrackPad Hub »</text>
    <text x="36" y="372" font-size="12" fill="#8e8e93">3. Activez « Autoriser l'accès complet »</text>
    <text x="36" y="392" font-size="12" fill="#8e8e93">4. Il se connecte directement à votre Mac</text>
    <text x="36" y="420" font-size="12" fill="#ff9f0a">Non installé — voir Réglages › Claviers</text>
  </g>

  <!-- Astuces -->
  <g font-family="-apple-system, Helvetica, Arial">
    <rect x="20" y="452" width="350" height="140" rx="14" fill="#1c1c1e"/>
    <text x="36" y="478" font-size="15" font-weight="500" fill="#fff">Astuces trackpad</text>
    <text x="36" y="500" font-size="12" fill="#8e8e93">1 doigt bouge le curseur</text>
    <text x="36" y="522" font-size="12" fill="#8e8e93">2 doigts font défiler</text>
    <text x="36" y="544" font-size="12" fill="#8e8e93">Appui bref : 1 = clic · 2 = clic droit · 3 = milieu</text>
    <text x="36" y="566" font-size="12" fill="#8e8e93">3 doigts en mouvement : glisser-déposer</text>
    <text x="36" y="588" font-size="12" fill="#5f5f66">TrackPad Hub · v1.0</text>
  </g>

  <!-- Tab bar -->
  <rect x="6" y="790" width="378" height="48" rx="22" fill="#111114"/>
  <g text-anchor="middle">
    <rect x="34" y="806" width="22" height="16" rx="3" fill="#8e8e93"/>
    <text x="55" y="833" font-family="-apple-system, Helvetica, Arial" font-size="10" fill="#8e8e93">Trackpad</text>
