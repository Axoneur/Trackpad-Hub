<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844">
  <rect x="1" y="1" width="388" height="842" rx="44" fill="#0a0a0c"/>
  <rect x="5" y="5" width="380" height="834" rx="40" fill="#000"/>
  <rect x="135" y="12" width="120" height="30" rx="15" fill="#000"/>
  <text x="24" y="33" font-family="-apple-system, Helvetica, Arial" font-size="14" font-weight="600" fill="#fff">9:41</text>
  <g fill="#fff">
    <rect x="300" y="22" width="18" height="10" rx="3"/>
    <rect x="322" y="24" width="12" height="8" rx="2"/>
